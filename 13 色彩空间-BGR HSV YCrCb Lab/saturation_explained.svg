<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620">
  <rect width="980" height="620" fill="#f8f5ef"/>

  <text x="54" y="66" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1a1a1a">Saturation: same hue, different color purity</text>
  <text x="54" y="102" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444">The hue stays red, but the color moves from grayish to vivid as saturation increases.</text>

  <rect x="58" y="150" width="260" height="360" rx="24" fill="#fffdf8" stroke="#d9d1c5" stroke-width="2"/>
  <text x="128" y="204" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">Low S</text>
  <text x="102" y="238" font-family="Courier New, monospace" font-size="20" fill="#333">H = red, S = 40, V = 220</text>
  <rect x="102" y="272" width="170" height="140" rx="20" fill="#dfaaaa" stroke="#a88787" stroke-width="2"/>
  <text x="104" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333">Looks washed out and mixed with gray.</text>

  <rect x="360" y="150" width="260" height="360" rx="24" fill="#fffdf8" stroke="#d9d1c5" stroke-width="2"/>
  <text x="418" y="204" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">Medium S</text>
  <text x="392" y="238" font-family="Courier New, monospace" font-size="20" fill="#333">H = red, S = 130, V = 220</text>
  <rect x="404" y="272" width="170" height="140" rx="20" fill="#eb6f6f" stroke="#b05b5b" stroke-width="2"/>
  <text x="400" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333">Clearly red, but still somewhat soft.</text>

  <rect x="662" y="150" width="260" height="360" rx="24" fill="#fffdf8" stroke="#d9d1c5" stroke-width="2"/>
  <text x="734" y="204" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">High S</text>
  <text x="696" y="238" font-family="Courier New, monospace" font-size="20" fill="#333">H = red, S = 255, V = 220</text>
  <rect x="706" y="272" width="170" height="140" rx="20" fill="#ff0000" stroke="#a94040" stroke-width="2"/>
  <text x="688" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333">Strong, pure, vivid red.</text>

  <line x1="146" y1="556" x2="836" y2="556" stroke="#2a2a2a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="390" y="540" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1a1a1a">S increases</text>

  <text x="60" y="592" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333">Key idea: saturation does not decide the hue family. It decides how far the color is from neutral gray.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2a2a2a"/>
    </marker>
  </defs>
</svg>