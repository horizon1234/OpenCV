<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760">
  <rect width="1120" height="760" fill="#f5f1e8"/>
  <text x="60" y="56" font-size="34" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#2f261d">同一张图做“提亮”，四种空间为什么结果不一样</text>
  <text x="60" y="92" font-size="18" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6d5a47">关键不是谁更高级，而是你在不同空间里控制的视觉属性本来就不同。</text>

  <g transform="translate(70,140)">
    <rect x="0" y="0" width="460" height="250" rx="24" fill="#efe3d5" stroke="#cab39c" stroke-width="2"/>
    <text x="26" y="40" font-size="28" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#58392c">BGR：直接拉通道</text>
    <rect x="30" y="66" width="168" height="120" rx="18" fill="#9f6f56"/>
    <rect x="78" y="94" width="72" height="64" rx="14" fill="#d28c61"/>
    <text x="38" y="212" font-size="17" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#694c3c">常见做法：加 R、减 B</text>
    <text x="38" y="236" font-size="17" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#694c3c">结果：不只变亮，还会偏暖、偏红、偏艳</text>

    <g transform="translate(240,68)">
      <rect x="0" y="0" width="190" height="120" rx="16" fill="#cc8e65"/>
      <rect x="56" y="28" width="78" height="66" rx="14" fill="#f1a16d"/>
      <circle cx="28" cy="22" r="8" fill="#f6c2a0"/>
      <circle cx="160" cy="92" r="11" fill="#864d3a" opacity="0.45"/>
    </g>
  </g>

  <g transform="translate(590,140)">
    <rect x="0" y="0" width="460" height="250" rx="24" fill="#e6ece0" stroke="#b7c3ab" stroke-width="2"/>
    <text x="26" y="40" font-size="28" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#31472d">HSV：提高 V</text>
    <rect x="30" y="66" width="168" height="120" rx="18" fill="#8b5c43"/>
    <rect x="78" y="94" width="72" height="64" rx="14" fill="#c96a3c"/>
    <text x="38" y="212" font-size="17" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#4e5f47">常见做法：保持 H、S，增大 V</text>
    <text x="38" y="236" font-size="17" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#4e5f47">结果：看起来更亮，但不等于严格感知亮度</text>

    <g transform="translate(240,68)">
      <rect x="0" y="0" width="190" height="120" rx="16" fill="#c87b4b"/>
      <rect x="56" y="28" width="78" height="66" rx="14" fill="#f28a50"/>
      <circle cx="26" cy="24" r="9" fill="#ffd3b5"/>
      <circle cx="160" cy="92" r="11" fill="#84462a" opacity="0.28"/>
    </g>
  </g>

  <g transform="translate(70,440)">
    <rect x="0" y="0" width="460" height="250" rx="24" fill="#e4edf0" stroke="#b3c8cf" stroke-width="2"/>
    <text x="26" y="40" font-size="28" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#29404d">YCrCb：提高 Y</text>
    <rect x="30" y="66" width="168" height="120" rx="18" fill="#8a7259"/>
    <rect x="78" y="94" width="72" height="64" rx="14" fill="#c88f66"/>
    <text x="38" y="212" font-size="17" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#49606a">常见做法：固定 Cr/Cb，只提高 Y</text>
    <text x="38" y="236" font-size="17" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#49606a">结果：更偏“保色提亮”，色偏通常更小</text>

    <g transform="translate(240,68)">
      <rect x="0" y="0" width="190" height="120" rx="16" fill="#c2aa8d"/>
      <rect x="56" y="28" width="78" height="66" rx="14" fill="#e0a87d"/>
      <circle cx="26" cy="24" r="9" fill="#f5dcc7"/>
      <circle cx="160" cy="92" r="11" fill="#8b5e3f" opacity="0.22"/>
    </g>
  </g>

  <g transform="translate(590,440)">
    <rect x="0" y="0" width="460" height="250" rx="24" fill="#efe7de" stroke="#cdbca9" stroke-width="2"/>
    <text x="26" y="40" font-size="28" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#50392a">Lab：提高 L</text>
    <rect x="30" y="66" width="168" height="120" rx="18" fill="#88705f"/>
    <rect x="78" y="94" width="72" height="64" rx="14" fill="#c8926b"/>
    <text x="38" y="212" font-size="17" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6a5546">常见做法：固定 a/b，只提高 L</text>
    <text x="38" y="236" font-size="17" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6a5546">结果：更适合按感知明度去理解“提亮”</text>

    <g transform="translate(240,68)">
      <rect x="0" y="0" width="190" height="120" rx="16" fill="#d7b9a0"/>
      <rect x="56" y="28" width="78" height="66" rx="14" fill="#ecae84"/>
      <circle cx="26" cy="24" r="9" fill="#fff1df"/>
      <circle cx="160" cy="92" r="11" fill="#8b6548" opacity="0.18"/>
    </g>
  </g>
</svg>
