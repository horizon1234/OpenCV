<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320">
  <rect width="980" height="320" fill="#f4f0e8"/>
  <text x="40" y="44" font-size="28" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#2d291f">Lab 中固定 L/a，只调整 b</text>
  <text x="40" y="78" font-size="18" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#6a6252">b 从小到大，大致对应从偏蓝到偏黄。明度结构近似不变，整体冷暖方向变化更明显。</text>

  <g transform="translate(55,120)">
    <rect x="0" y="0" width="240" height="140" rx="18" fill="#637292" stroke="#3f4961" stroke-width="2"/>
    <rect x="68" y="26" width="104" height="88" rx="18" fill="#7b93c5"/>
    <circle cx="86" cy="62" r="9" fill="#a7b9e4"/>
    <circle cx="154" cy="78" r="12" fill="#c3d1f1"/>
    <text x="20" y="126" font-size="20" font-family="monospace" fill="#eef3ff">b = 78</text>
    <text x="166" y="126" font-size="16" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#eef3ff">偏蓝</text>
  </g>

  <g transform="translate(370,120)">
    <rect x="0" y="0" width="240" height="140" rx="18" fill="#8b867d" stroke="#625d55" stroke-width="2"/>
    <rect x="68" y="26" width="104" height="88" rx="18" fill="#b9ae9c"/>
    <circle cx="86" cy="62" r="9" fill="#ddd0bb"/>
    <circle cx="154" cy="78" r="12" fill="#eee4d3"/>
    <text x="20" y="126" font-size="20" font-family="monospace" fill="#fffaf1">b = 128</text>
    <text x="158" y="126" font-size="16" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#fffaf1">中性</text>
  </g>

  <g transform="translate(685,120)">
    <rect x="0" y="0" width="240" height="140" rx="18" fill="#ab8e4d" stroke="#7a6331" stroke-width="2"/>
    <rect x="68" y="26" width="104" height="88" rx="18" fill="#d9ba63"/>
    <circle cx="86" cy="62" r="9" fill="#f2d98e"/>
    <circle cx="154" cy="78" r="12" fill="#f8e7b6"/>
    <text x="20" y="126" font-size="20" font-family="monospace" fill="#fff8e5">b = 188</text>
    <text x="166" y="126" font-size="16" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#fff8e5">偏黄</text>
  </g>

  <path d="M304 190 L352 190" stroke="#8a805f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M619 190 L667 190" stroke="#8a805f" stroke-width="4" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a805f"/>
    </marker>
  </defs>
</svg>
