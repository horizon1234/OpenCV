<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640">
  <rect width="980" height="640" fill="#f7f4ee"/>

  <text x="50" y="64" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1a1a1a">What happens when only R increases</text>
  <text x="50" y="100" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444">Example from the lesson: B=60, G=120, R=200 becomes B=60, G=120, R=230.</text>

  <rect x="58" y="150" width="360" height="410" rx="24" fill="#fffdf8" stroke="#d9d1c5" stroke-width="2"/>
  <text x="92" y="198" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">Before</text>
  <text x="92" y="232" font-family="Courier New, monospace" font-size="20" fill="#333">B=60  G=120  R=200</text>
  <rect x="96" y="270" width="280" height="130" rx="18" fill="rgb(200,120,60)" stroke="#8f7c6a" stroke-width="2"/>
  <text x="102" y="430" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333">Visual feeling: warm orange-brown, but still balanced by green and blue.</text>

  <rect x="562" y="150" width="360" height="410" rx="24" fill="#fffdf8" stroke="#d9d1c5" stroke-width="2"/>
  <text x="596" y="198" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">After only adding R</text>
  <text x="596" y="232" font-family="Courier New, monospace" font-size="20" fill="#333">B=60  G=120  R=230</text>
  <rect x="600" y="270" width="280" height="130" rx="18" fill="rgb(230,120,60)" stroke="#8f7c6a" stroke-width="2"/>
  <text x="606" y="430" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333">Visual feeling: more reddish and brighter, with stronger channel imbalance.</text>

  <line x1="430" y1="335" x2="548" y2="335" stroke="#262626" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="448" y="315" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">+30 on R only</text>

  <text x="58" y="606" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#333">Key point: one-channel editing changes not only hue tendency, but also brightness balance and perceived vividness.</text>

  <g transform="translate(92 465)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333">Channel bars</text>

    <text x="0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333">B</text>
    <rect x="30" y="22" width="120" height="18" rx="9" fill="#dbe9ff"/>
    <rect x="30" y="22" width="35" height="18" rx="9" fill="#4f7bd9"/>

    <text x="0" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333">G</text>
    <rect x="30" y="54" width="120" height="18" rx="9" fill="#dcf5e3"/>
    <rect x="30" y="54" width="71" height="18" rx="9" fill="#43a047"/>

    <text x="0" y="102" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333">R</text>
    <rect x="30" y="86" width="120" height="18" rx="9" fill="#ffd8d3"/>
    <rect x="30" y="86" width="118" height="18" rx="9" fill="#d84a3a"/>
  </g>

  <g transform="translate(596 465)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333">Channel bars</text>

    <text x="0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333">B</text>
    <rect x="30" y="22" width="120" height="18" rx="9" fill="#dbe9ff"/>
    <rect x="30" y="22" width="35" height="18" rx="9" fill="#4f7bd9"/>

    <text x="0" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333">G</text>
    <rect x="30" y="54" width="120" height="18" rx="9" fill="#dcf5e3"/>
    <rect x="30" y="54" width="71" height="18" rx="9" fill="#43a047"/>

    <text x="0" y="102" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333">R</text>
    <rect x="30" y="86" width="120" height="18" rx="9" fill="#ffd8d3"/>
    <rect x="30" y="86" width="120" height="18" rx="9" fill="#d84a3a"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#262626"/>
    </marker>
  </defs>
</svg>