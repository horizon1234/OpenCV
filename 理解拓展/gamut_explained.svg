<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760">
  <rect width="980" height="760" fill="#f4f0e7"/>
  <text x="48" y="54" font-size="32" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#2b241c">色域是什么：为什么 RGB 设备显示不出“所有颜色”</text>
  <text x="48" y="90" font-size="18" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#67594c">下面不是严格的 CIE 数据图，而是帮助理解的示意图：外层像“所有可见颜色”，内层多边形像具体设备色域。</text>

  <g transform="translate(120,150)">
    <path d="M280 0 C406 6, 548 96, 606 210 C660 318, 634 462, 508 544 C382 626, 186 642, 78 530 C-36 412, -26 214, 86 92 C136 40, 212 8, 280 0 Z" fill="url(#visibleGradient)" stroke="#7a6c5c" stroke-width="3"/>
    <path d="M170 122 L444 154 L314 420 Z" fill="rgba(255,255,255,0.0)" stroke="#c96359" stroke-width="5"/>
    <path d="M132 106 L474 134 L344 468 Z" fill="rgba(255,255,255,0.0)" stroke="#4f8ecf" stroke-width="5" stroke-dasharray="10 8"/>
    <path d="M112 92 L510 118 L362 500 Z" fill="rgba(255,255,255,0.0)" stroke="#4f6c3d" stroke-width="5" stroke-dasharray="14 10"/>

    <circle cx="170" cy="122" r="7" fill="#c96359"/>
    <circle cx="444" cy="154" r="7" fill="#c96359"/>
    <circle cx="314" cy="420" r="7" fill="#c96359"/>

    <text x="530" y="124" font-size="22" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#4f6c3d">更大色域</text>
    <text x="494" y="164" font-size="18" font-family="monospace" fill="#4f8ecf">Display P3 / Adobe RGB</text>
    <text x="460" y="212" font-size="18" font-family="monospace" fill="#c96359">sRGB</text>
    <text x="632" y="332" font-size="22" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#2b241c">可见颜色范围</text>
  </g>

  <g transform="translate(76,648)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="#c96359" stroke-width="5"/>
    <text x="48" y="6" font-size="18" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5b4838">sRGB：网页、普通显示最常见</text>
    <line x1="330" y1="0" x2="366" y2="0" stroke="#4f8ecf" stroke-width="5" stroke-dasharray="10 8"/>
    <text x="378" y="6" font-size="18" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5b4838">P3 / Adobe RGB：更大</text>
    <line x1="642" y1="0" x2="678" y2="0" stroke="#4f6c3d" stroke-width="5" stroke-dasharray="14 10"/>
    <text x="690" y="6" font-size="18" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#5b4838">更大色域标准</text>
  </g>

  <defs>
    <radialGradient id="visibleGradient" cx="45%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#f8f0df"/>
      <stop offset="16%" stop-color="#f0d264"/>
      <stop offset="32%" stop-color="#86d06c"/>
      <stop offset="48%" stop-color="#64b5ea"/>
      <stop offset="64%" stop-color="#7d70e7"/>
      <stop offset="80%" stop-color="#db6b8d"/>
      <stop offset="100%" stop-color="#ea8b57"/>
    </radialGradient>
  </defs>
</svg>
